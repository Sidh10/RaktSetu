[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raktsetu-app"
version = "0.1.0"
description = "RaktSetu Round 2 prototype backend (simulated data, mock channel, not clinically validated)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "python-multipart>=0.0.9",
    "anthropic>=1.14,<2",
    "tzdata>=2024.1",   # Windows has no system time-zone database
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    # Parity tests only: the simulator's random draws and record formatting use numpy.
    # The app itself (app/core included) never imports numpy.
    "numpy>=1.26",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
